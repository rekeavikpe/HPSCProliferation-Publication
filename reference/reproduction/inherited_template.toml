K_Lac = [0.1, 10000.0]
alpha = [1.0, 500.0]
Y_GLac = [0.01, 2.0]
K_tau = [1.0e-5, 5.0]
K_eps = [1.0e-5, 5.0]
K_G = [0.1, 400.0]
gamma = [1.0e-6, 10.0]
