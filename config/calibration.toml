analysis_id = "100mL-reproduction-all-free-p50"
exposure_percentile = 50
cohort = "available_measurements"
initial_glucose = "condition mean of measured day-zero values"
fresh_glucose = "same as initial glucose; explicit working assumption"
initial_lactate_mM = 0.0
initial_aggregate_um = 15.0
initial_state_note = "Lactate zero and aggregate 15 um are inherited model assumptions, not substituted observations."
parameter_count_policy = "All kinetic parameters free; count 9/12/12/12/12/11/13 for models 0/1/3/4/5/6/7. No fitted noise parameters."

[fixed]

[likelihood]
kind = "fixed_sigma_gaussian_on_condition_day_state_means"
relative_floor = 0.05
metabolite_floor_mM = 0.5
note = "Sample SD, not SEM. Working diagonal score; repeated-day dependence is not modelled. BIC uses the working diagonal likelihood; temporal covariance remains unmodelled."

[solver]
reltol = 1e-11
abstol = 1e-12

[optimization]
starts = 6
seed = 20261003
local_iterations = 300
polish_iterations = 3000
note = "Six independent bounds-based starts per model, followed by own-optimum and 100-mL Model 5 anchor refinement; no global optimum guarantee."

[bounds]
K_d = [0.001, 1.0]
K_G = [0.1, 400.0]
K_oG = [1e-8, 1e-4]
Y_GLac = [0.01, 2.0]
alpha = [1.0, 500.0]
mu_max = [0.001, 2.0]
K_tau = [1e-5, 5.0]
K_eps = [1e-5, 5.0]
K_Agg = [1e5, 1e10]
K_Lac = [0.1, 1e4]
Y_GX = [1e-10, 1e-4]
delta_max = [1e-6, 10.0]
gamma = [1e-6, 10.0]
